name: safeline

networks:
  safeline-ce:
    name: safeline-ce
    driver: bridge
    ipam:
      config:
        - gateway: ${SUBNET_PREFIX:?SUBNET_PREFIX required}.1
          subnet: ${SUBNET_PREFIX}.0/24
    driver_opts:
      com.docker.network.bridge.name: safeline-ce

services:
  postgres:
    container_name: safeline-pg
    image: chaitin/safeline-postgres:15.18
    restart: always
    volumes:
      - ${SAFELINE_DIR:?SAFELINE_DIR required}/resources/postgres/data:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      POSTGRES_USER: safeline-ce
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    command: [postgres, -c, max_connections=600]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U safeline-ce -d safeline-ce]
    networks:
      safeline-ce:
        ipv4_address: ${SUBNET_PREFIX}.2

  mgt:
    container_name: safeline-mgt
    image: chaitin/safeline-mgt-g:${SAFELINE_IMAGE_TAG:-9.4.0}
    restart: always
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${SAFELINE_DIR}/resources/mgt:/app/data
      - ${SAFELINE_DIR}/logs/nginx:/app/log/nginx:z
      - ${SAFELINE_DIR}/resources/sock:/app/sock
      - /var/run:/app/run
    ports:
      - 127.0.0.1:${SAFELINE_MGT_PORT:-9443}:1443
    environment:
      MGT_PG: postgres://safeline-ce:${POSTGRES_PASSWORD}@safeline-pg/safeline-ce?sslmode=disable
      MGT_PROXY: "0"
    healthcheck:
      test: [CMD, curl, -k, -f, https://localhost:1443/api/open/health]
    depends_on:
      - postgres
      - fvm
    logging: &safeline-logging
      driver: json-file
      options:
        max-size: 100m
        max-file: "5"
    networks:
      safeline-ce:
        ipv4_address: ${SUBNET_PREFIX}.4

  detect:
    container_name: safeline-detector
    image: chaitin/safeline-detector-g:${SAFELINE_IMAGE_TAG:-9.4.0}
    restart: always
    volumes:
      - ${SAFELINE_DIR}/resources/detector:/resources/detector
      - ${SAFELINE_DIR}/logs/detector:/logs/detector
      - /etc/localtime:/etc/localtime:ro
    environment:
      LOG_DIR: /logs/detector
    logging: *safeline-logging
    networks:
      safeline-ce:
        ipv4_address: ${SUBNET_PREFIX}.5

  tengine:
    container_name: safeline-tengine
    image: chaitin/safeline-tengine-g:${SAFELINE_IMAGE_TAG:-9.4.0}
    restart: always
    network_mode: host
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/resolv.conf:/etc/resolv.conf:ro
      - ${SAFELINE_DIR}/resources/nginx:/etc/nginx
      - ${SAFELINE_DIR}/resources/detector:/resources/detector
      - ${SAFELINE_DIR}/resources/chaos:/resources/chaos
      - ${SAFELINE_DIR}/logs/nginx:/var/log/nginx:z
      - ${SAFELINE_DIR}/resources/cache:/usr/local/nginx/cache
      - ${SAFELINE_DIR}/resources/sock:/app/sock
    environment:
      TCD_MGT_API: https://${SUBNET_PREFIX}.4:1443/api/open/publish/server
      TCD_SNSERVER: ${SUBNET_PREFIX}.5:8000
      SNSERVER_ADDR: ${SUBNET_PREFIX}.5:8000
      CHAOS_ADDR: ${SUBNET_PREFIX}.10
    ulimits:
      nofile: 131072
    logging: *safeline-logging

  luigi:
    container_name: safeline-luigi
    image: chaitin/safeline-luigi-g:${SAFELINE_IMAGE_TAG:-9.4.0}
    restart: always
    environment:
      MGT_IP: ${SUBNET_PREFIX}.4
      LUIGI_PG: postgres://safeline-ce:${POSTGRES_PASSWORD}@safeline-pg/safeline-ce?sslmode=disable
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${SAFELINE_DIR}/resources/luigi:/app/data
    depends_on:
      - detect
      - mgt
    logging: *safeline-logging
    networks:
      safeline-ce:
        ipv4_address: ${SUBNET_PREFIX}.7

  fvm:
    container_name: safeline-fvm
    image: chaitin/safeline-fvm-g:${SAFELINE_IMAGE_TAG:-9.4.0}
    restart: always
    volumes:
      - /etc/localtime:/etc/localtime:ro
    logging: *safeline-logging
    networks:
      safeline-ce:
        ipv4_address: ${SUBNET_PREFIX}.8

  chaos:
    container_name: safeline-chaos
    image: chaitin/safeline-chaos-g:${SAFELINE_IMAGE_TAG:-9.4.0}
    restart: always
    environment:
      DB_ADDR: postgres://safeline-ce:${POSTGRES_PASSWORD}@safeline-pg/safeline-ce?sslmode=disable
    volumes:
      - ${SAFELINE_DIR}/resources/sock:/app/sock
      - ${SAFELINE_DIR}/resources/chaos:/app/chaos
    logging: *safeline-logging
    networks:
      safeline-ce:
        ipv4_address: ${SUBNET_PREFIX}.10
