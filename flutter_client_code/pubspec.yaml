name: siab1
description: SIAB1 - Sistem Informasi Asesmen Berintegritas
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking
  dio: ^5.3.0

  # Crypto & Security
  crypto: ^3.0.3
  encrypt: ^5.0.1
  flutter_jailbreak_detection: ^1.10.0

  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # WebView
  flutter_inappwebview: ^6.0.0

  # State Management
  provider: ^6.0.5

  # Device Info
  device_info_plus: ^9.0.3
  package_info_plus: ^5.0.1  # For app version in security headers

  # Permissions
  permission_handler: ^11.0.1

  # Connectivity
  connectivity_plus: ^5.0.2

  # QR Code Scanner
  mobile_scanner: ^3.5.2

  # Screenshot Detection
  screenshot_callback: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1


flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_man1.png
