global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'ujian-online'
    env: 'production'

scrape_configs:
  # FastAPI application metrics. API ports are internal-only; public /metrics
  # is explicitly blocked by Nginx.
  - job_name: 'fastapi'
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets:
          - 'api:8000'
          - 'api2:8000'
          - 'api3:8000'
          - 'api4:8000'
          - 'api5:8000'
          - 'api6:8000'
          - 'api7:8000'
          - 'api8:8000'
        labels:
          plane: 'student'
      - targets:
          - 'api_admin:8000'
          - 'api_admin2:8000'
        labels:
          plane: 'control'

  # PostgreSQL metrics (requires postgres_exporter)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s
    
  # Redis metrics (requires redis_exporter)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 10s

  # Nginx metrics (if nginx-prometheus-exporter is added)
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
    scrape_interval: 10s

  # Node/System metrics (requires node_exporter)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s
