<!DOCTYPE html>
<html lang="id">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hasil Ujian - Admin Panel | Ujian Online</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .exam-card.selected {
            background: rgba(99, 102, 241, 0.1) !important;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2) !important;
        }

        .exam-card.selected:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.3) !important;
        }

        /* Fix for export dropdown visibility - POSITION FIXED to escape overflow:hidden */
        .dropdown-menu.show {
            display: block !important;
            opacity: 1 !important;
            visibility: visible !important;
            transform: none !important;
            background: #1e293b !important;
            position: fixed !important;
            z-index: 9999 !important;
        }

        /* Ensure parent dropdown container has proper positioning */
        .user-dropdown {
            position: relative;
        }

        .review-toolbar {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 0.75rem;
        }

        .review-filter-btn {
            border: 1px solid rgba(148, 163, 184, 0.35);
            background: rgba(15, 23, 42, 0.35);
            color: #cbd5e1;
            border-radius: 999px;
            padding: 0.35rem 0.8rem;

            cursor: pointer;

        .review-filter-btn.active {

            background: rgba(34, 197, 94, 0.16);

        }

        .review-q-card {
            background: rgba(15, 23, 42, 0.32);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 0.75rem;
            padding: 0.9rem;
            margin-bottom: 0.75rem;
        }

        .review-answer-box {
            background: rgba(2, 6, 23, 0.45);
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 0.5rem;
            padding: 0.55rem 0.65rem;

</head>

<body>

            <!-- Active Exam Info Bar (shows after selection) -->

                    <div style="display: flex; gap: 0.5rem; align-items: center;">

                            <i class="fas fa-trash-can"></i> Hapus Hasil
                        </button>
                        <div class="user-dropdown">
                            <button class="btn btn-secondary btn-sm" id="export-btn"

            <!-- Filter Bar -->
            <div class="card" id="filter-bar" style="display: none; margin-bottom: 1rem;">
                <div style="display: flex; gap: 1rem; flex-wrap: wrap; align-items: center;">
                    <div class="search-box" style="flex: 1; min-width: 200px;">

            <!-- Summary Stats -->

                <div class="stat-card">
                    <div class="stat-icon users"><i class="fas fa-users"></i></div>

            <div class="card" id="participation-summary-card" style="display: none; margin-bottom: 1rem; border-color: rgba(245, 158, 11, 0.28);">

                        <p id="participation-summary-text" style="margin: 0; color: var(--text-secondary); font-size: 0.9rem;">-</p>

                    <div style="display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap;">
                        <div id="participation-summary-badges" style="display: flex; gap: 0.5rem; flex-wrap: wrap;"></div>
                        <button class="btn btn-sm btn-secondary" onclick="exportParticipationSummary('csv')" title="Download CSV daftar target, submitted, belum start, dan start belum submit">

                        <button class="btn btn-sm btn-secondary" onclick="exportParticipationSummary('excel')" title="Download Excel daftar kehadiran">

                        <button class="btn btn-sm btn-secondary" onclick="exportParticipationSummary('pdf')" title="Download PDF daftar kehadiran">

                        <button class="btn btn-sm btn-secondary" onclick="exportParticipationSummary('docx')" title="Download Word daftar kehadiran">

            <div class="card" id="results-card" style="display: none;">

                    <table>

                                <th>No</th>

                                <th>Ujian</th>
                                <th>Nilai</th>

    <!-- Detail Modal -->
    <div class="modal-overlay" id="detail-modal">
        <div class="modal" style="max-width: 600px;">
            <div class="modal-header">
                <h3 class="modal-title">Detail Hasil</h3>
                <button class="modal-close" onclick="closeModal('detail-modal')">&times;</button>

    <!-- Review Answer Modal -->
    <div class="modal-overlay" id="review-modal">

                <h3 class="modal-title"><i class="fas fa-clipboard-check"></i> Review Jawaban Siswa</h3>
                <button class="modal-close" onclick="closeModal('review-modal')">&times;</button>

    <script src="/static/js/api.js?v=20260310-results-review-v1"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/sidebar-loader.js"></script>
    <script>
        if (!auth.requireAuth(['admin', 'developer', 'teacher'])) {
            throw new Error('AUTH_REQUIRED');
        }

        let allExams = [];
        let allResults = [];
        let currentExam = null;
        let currentParticipationSummary = null;
        let currentUser = auth.getUser();
        const isTeacher = currentUser && currentUser.role === 'teacher';
        const EXPORT_BRANDING = {
            schoolName: 'MADRASAH ALIYAH NEGERI 1 ROKAN HULU',
            reportSubtitle: 'Sistem Ujian Online - Dokumen Resmi',
            logoPath: '/static/uploads/logo-man1.jpeg'
        };
        let exportLogoDataUrlPromise = null;
        const sessionReviewCache = new Map();
        let activeReviewPayload = null;
        let activeReviewFilter = 'all';
        let activeReviewSearch = '';
        const examBreakdownLoaded = new Set();

        // ========================================
        // TIMEZONE FORMATTER (WIB - Asia/Jakarta)
        // ========================================
        function formatWIB(dateString, options = {}) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            const defaultOptions = {
                timeZone: 'Asia/Jakarta',
                day: 'numeric',
                month: 'short',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            };
            return date.toLocaleString('id-ID', { ...defaultOptions, ...options });
        }

        // DEPRECATED: Use formatWIB instead
        function formatDate(dateString) {
            return formatWIB(dateString);
        }

        function escapeHtml(value) {
            if (value === null || value === undefined) return '';
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function slugifyFilename(value) {
            return String(value || 'export')
                .trim()
                .replace(/[^\w\s-]/g, '')
                .replace(/\s+/g, '_')
                .replace(/_+/g, '_');
        }

        function formatQuestionTypeLabel(type) {
            const map = {
                multiple_choice: 'Pilihan Ganda',
                multiple_choice_complex: 'PG Kompleks',
                true_false: 'Benar/Salah',
                essay: 'Essay',
                short_answer: 'Isian Singkat'
            };
            return map[type] || type || '-';
        }

        async function getExportLogoDataUrl() {
            if (!exportLogoDataUrlPromise) {
                exportLogoDataUrlPromise = (async () => {
                    try {
                        const response = await fetch(EXPORT_BRANDING.logoPath, { cache: 'force-cache' });
                        if (!response.ok) return null;
                        const blob = await response.blob();
                        return await new Promise((resolve) => {
                            const reader = new FileReader();
                            reader.onload = () => resolve(reader.result);
                            reader.onerror = () => resolve(null);
                            reader.readAsDataURL(blob);
                        });
                    } catch (error) {
                        console.warn('Logo export tidak tersedia:', error);
                        return null;
                    }
                })();
            }
            return exportLogoDataUrlPromise;
        }
        // ========================================

        // Bulk selection state
        let checkboxMode = false;
        let selectedExamIds = new Set();

        // Toggle export dropdown with PORTAL positioning (appended to body)
        function toggleExportDropdown(btn) {
            let dropdown = document.getElementById('global-export-dropdown');

            // If open, close it
            if (dropdown) {
                closeExportDropdownGlobal();
                return;
            }

            // Create new dropdown attached to body
            dropdown = document.createElement('div');
            dropdown.id = 'global-export-dropdown';
            dropdown.className = 'dropdown-menu show';
            dropdown.style.cssText = `
                position: fixed;
                z-index: 99999;
                display: block;
                background: #1e293b;
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 1rem;
                padding: 0.5rem;
                box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.6);
                min-width: 200px;
                opacity: 1;
                visibility: visible;
                transform: none;
            `;

            // Calculate position
            const rect = btn.getBoundingClientRect();
            dropdown.style.top = (rect.bottom + 8) + 'px';
            dropdown.style.right = (window.innerWidth - rect.right) + 'px';

            // Content
            dropdown.innerHTML = `
                <a href="#" class="dropdown-item" onclick="exportResults('csv'); closeExportDropdownGlobal();">
                    <i class="fas fa-file-csv" style="color: #22c55e;"></i> Export CSV
                </a>
                <a href="#" class="dropdown-item" onclick="exportResults('excel'); closeExportDropdownGlobal();">
                    <i class="fas fa-file-excel" style="color: #10b981;"></i> Export Excel
                </a>
                <a href="#" class="dropdown-item" onclick="exportResults('pdf'); closeExportDropdownGlobal();">
                    <i class="fas fa-file-pdf" style="color: #ef4444;"></i> Export PDF
                </a>
                <div style="border-top: 1px solid rgba(255, 255, 255, 0.1); margin: 0.5rem 0;"></div>
                <a href="#" class="dropdown-item" onclick="exportSummary(); closeExportDropdownGlobal();">
                    <i class="fas fa-chart-pie" style="color: #8b5cf6;"></i> Statistik
                </a>
                <a href="#" class="dropdown-item" onclick="printResults(); closeExportDropdownGlobal();">
                    <i class="fas fa-print" style="color: #6366f1;"></i> Print
                </a>
                <div style="border-top: 1px solid rgba(255, 255, 255, 0.1); margin: 0.5rem 0;"></div>
                <div style="padding: 0.25rem 1rem; font-size: 0.75rem; color: #64748b; font-weight: 600;">EXPORT SOAL</div>
                <a href="#" class="dropdown-item" onclick="exportCurrentExamQuestions('pdf'); closeExportDropdownGlobal();">
                    <i class="fas fa-file-pdf" style="color: #f97316;"></i> Soal PDF
                </a>
                <a href="#" class="dropdown-item" onclick="exportCurrentExamQuestions('docx'); closeExportDropdownGlobal();">
                    <i class="fas fa-file-word" style="color: #3b82f6;"></i> Soal DOCX
                </a>
                <a href="#" class="dropdown-item" onclick="exportCurrentExamQuestions('excel'); closeExportDropdownGlobal();">
                    <i class="fas fa-file-excel" style="color: #22c55e;"></i> Soal Excel
                </a>
            `;

            document.body.appendChild(dropdown);

            // Close when clicking outside
            setTimeout(() => {
                document.addEventListener('click', closeExportDropdownGlobal);
            }, 10);
        }

        function closeExportDropdownGlobal(e) {
            const dropdown = document.getElementById('global-export-dropdown');
            const btn = document.getElementById('export-btn');
            // If internal call (e undefined) or click outside
            if (dropdown && (!e || (!dropdown.contains(e.target) && !btn.contains(e.target)))) {
                dropdown.remove();
                document.removeEventListener('click', closeExportDropdownGlobal);
            }
        }

        async function loadExams() {
            try {
                // Get exams that have results (including deleted/archived exams)
                let exams = await api.getExamsWithResults();

                // DEBUG: Check if teacher_name is present in API response
                console.log('[DEBUG-LOAD-EXAMS] 🔍 Total exams loaded:', exams.length);
                if (exams.length > 0) {
                    console.log('[DEBUG-LOAD-EXAMS] 📋 First exam sample:', {
                        id: exams[0].id,
                        title: exams[0].title,
                        teacher_name: exams[0].teacher_name,
                        has_teacher_name: !!exams[0].teacher_name
                    });
                }

                allExams = exams;
                renderExamCards(allExams);
            } catch (error) {
                showAlert('Gagal memuat data ujian', 'danger');
            }
        }

        function renderExamCards(exams) {
            const container = document.getElementById('exam-cards-container');

            // Show exams with results (backend now only returns exams with actual results)
            if (exams.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 2rem;">
                        <i class="fas fa-inbox" style="font-size: 2rem; color: var(--text-secondary); margin-bottom: 0.5rem;"></i>
                        <p style="color: var(--text-secondary);">Belum ada hasil ujian</p>
                        <small style="color: var(--text-secondary);">Hasil akan muncul setelah ada siswa yang menyelesaikan ujian</small>
                    </div>
                `;
                return;
            }

            container.innerHTML = exams.map(exam => {
                const status = getExamStatus(exam);
                const isArchived = exam.is_deleted === true;
                const isSelected = selectedExamIds.has(exam.id);

                return `
                    <div class="card exam-card ${isArchived ? 'archived' : ''} ${isSelected ? 'selected' : ''}"
                         data-exam-id="${exam.id}"
                         onclick="${checkboxMode ? `toggleExamSelection(${exam.id}, event)` : `selectExam(${exam.id})`}"
                         style="cursor: pointer; transition: all 0.3s ease;
                                border: 2px solid ${isSelected ? '#6366f1' : (isArchived ? '#f59e0b' : 'transparent')};
                                ${isArchived ? 'opacity: 0.9;' : ''}
                                position: relative;">
                        ${checkboxMode ? `
                            <div style="position: absolute; top: 8px; left: 8px; z-index: 10;">
                                <input type="checkbox"
                                       ${isSelected ? 'checked' : ''}
                                       onclick="toggleExamSelection(${exam.id}, event)"
                                       style="width: 18px; height: 18px; cursor: pointer; accent-color: var(--primary);">
                            </div>
                        ` : ''}
                        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.75rem;">
                            ${isArchived ?
                        '<span class="badge badge-warning" style="font-size: 0.7rem;">📦 ARSIP</span>' :
                        `<span class="badge badge-${status.class}" style="font-size: 0.7rem;">${status.label}</span>`
                    }
                            <i class="fas fa-chevron-right" style="color: var(--text-secondary); font-size: 0.75rem;"></i>
                        </div>
                        <h4 style="margin: 0 0 0.5rem 0; font-size: 0.95rem; line-height: 1.3;">${exam.title}</h4>
                        <div style="font-size: 0.75rem; color: var(--text-secondary);">
                            <div><i class="fas fa-clock" style="width: 14px;"></i> ${exam.duration_minutes} menit</div>
                            <div><i class="fas fa-check-circle" style="width: 14px;"></i> KKM: ${exam.passing_score || 70}</div>
                            ${isArchived ? '<div style="color: #f59e0b;"><i class="fas fa-archive" style="width: 14px;"></i> Ujian dihapus</div>' : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function getExamStatus(exam) {
            const now = new Date();
            const start = new Date(exam.start_time);
            const end = new Date(exam.end_time);
            // Tanpa konversi manual, browser handle timezone

            if (now < start) return { label: 'Mendatang', class: 'warning' };
            if (now >= start && now <= end) return { label: 'Berlangsung', class: 'success' };
            return { label: 'Selesai', class: 'primary' };
        }

        // Exam search filter
        document.getElementById('exam-search').addEventListener('input', (e) => {
            const search = e.target.value.toLowerCase();
            const filtered = allExams.filter(exam => exam.title.toLowerCase().includes(search));
            renderExamCards(filtered);
        });

        function selectExam(examId) {
            loadResults(examId);
        }

        function clearSelection() {
            currentExam = null;
            hideParticipationSummary();
            document.getElementById('exam-cards-section').style.display = 'block';
            document.getElementById('active-exam-bar').style.display = 'none';
            document.getElementById('filter-bar').style.display = 'none';
            document.getElementById('summary-stats').style.display = 'none';
            document.getElementById('results-card').style.display = 'none';
        }

        async function loadResults(examId) {
            const examCardsSection = document.getElementById('exam-cards-section');
            const activeExamBar = document.getElementById('active-exam-bar');
            const filterBar = document.getElementById('filter-bar');
            const resultsCard = document.getElementById('results-card');
            const summaryStats = document.getElementById('summary-stats');

            if (!examId) {
                clearSelection();
                return;
            }

            // Hide exam cards, show active exam bar and results
            examCardsSection.style.display = 'none';
            activeExamBar.style.display = 'block';
            filterBar.style.display = 'block';
            resultsCard.style.display = 'block';

            currentExam = allExams.find(e => e.id == examId);

            // Fetch full exam details only when summary metadata is missing.
            if (!currentExam?.teacher_name || !currentExam?.subject || !currentExam?.exam_type) {
                try {
                    const fullExamDetails = await api.getExam(examId);
                    if (fullExamDetails) {
                        currentExam = { ...currentExam, ...fullExamDetails };
                        console.log('[LOAD] Exam details loaded on-demand:', {
                            id: currentExam.id,
                            title: currentExam.title,
                            teacher_name: currentExam.teacher_name,
                            has_creator: !!currentExam.creator
                        });
                    }
                } catch (e) {
                    console.warn('Could not fetch full exam details', e);
                }
            }

            // Update active exam bar info with subject and exam_type
            const isArchived = currentExam?.is_deleted === true;
            document.getElementById('active-exam-title').innerHTML = `
                ${currentExam?.title || '-'}
                ${isArchived ? '<span class="badge badge-warning" style="margin-left: 0.5rem; font-size: 0.7rem;">📦 ARSIP</span>' : ''}
            `;
            const subject = currentExam?.subject ? `📚 ${currentExam.subject}` : '';
            const examType = currentExam?.exam_type ? `📋 ${currentExam.exam_type}` : '';
            document.getElementById('active-exam-info').innerHTML = `
                ${subject} ${subject && examType ? '|' : ''} ${examType}
                ${(subject || examType) ? '|' : ''}
                <i class="fas fa-clock"></i> ${currentExam?.duration_minutes || 0} menit &nbsp;|&nbsp;
                <i class="fas fa-check-circle"></i> KKM: ${currentExam?.passing_score || 70}
            `;

            document.getElementById('results-table').innerHTML = '<tr><td colspan="7"><div class="loading"><div class="spinner"></div></div></td></tr>';

            try {
                // Fetch lightweight results first; score breakdown is loaded on demand.
                const rawResults = await api.getExamResults(examId, false);
                examBreakdownLoaded.delete(Number(examId));

                try {
                    currentParticipationSummary = await api.getExamParticipationSummary(examId);
                    renderParticipationSummary(currentParticipationSummary);
                } catch (summaryError) {
                    console.warn('Gagal memuat ringkasan kehadiran ujian:', summaryError);
                    hideParticipationSummary();
                }

                // FIX: Calculate duration_taken (minutes) from duration_seconds (seconds)
                // This fixes "undefined menit" in detail view and export
                allResults = rawResults.map(r => ({
                    ...r,
                    duration_taken: r.duration_seconds ? Math.round(r.duration_seconds / 60) : 0
                }));

                // If no results yet, show empty state
                if (!allResults || allResults.length === 0) {
                    allResults = [];
                    renderResults(allResults);
                    summaryStats.style.display = 'none';
                    showAlert('Belum ada hasil ujian untuk ujian ini', 'info');
                    return;
                }

                renderResults(allResults);
                updateStats(allResults);
                summaryStats.style.display = 'grid';
            } catch (error) {
                console.error('Error loading results:', error);
                showAlert('Gagal memuat hasil: ' + (error.message || 'Unknown error'), 'danger');
                allResults = [];
                hideParticipationSummary();
                renderResults(allResults);
            }
        }

        // REMOVED: generateMockResults function - now using real API data

        function updateStats(results) {
            const total = results.length;
            const passed = results.filter(r => r.passed).length;
            const failed = total - passed;
            const avgScore = total > 0 ? (results.reduce((sum, r) => sum + r.score, 0) / total).toFixed(1) : 0;

            document.getElementById('total-participants').textContent = total;
            document.getElementById('total-passed').textContent = passed;
            document.getElementById('total-failed').textContent = failed;
            document.getElementById('average-score').textContent = avgScore;
        }

        function renderParticipationSummary(summary) {
            const card = document.getElementById('participation-summary-card');
            const text = document.getElementById('participation-summary-text');
            const badges = document.getElementById('participation-summary-badges');
            const warning = document.getElementById('participation-summary-warning');
            if (!card || !text || !badges || !warning || !summary) return;

            const target = Number(summary.target_count || 0);
            const submittedInTarget = Number(summary.submitted_in_target_count || 0);
            const submittedTotal = Number(summary.submitted_total_count || 0);
            const notStarted = Number(summary.not_started_count || 0);
            const startedNotSubmitted = Number(summary.started_not_submitted_count || 0);
            const outsideTarget = Number(summary.submitted_outside_target_count || 0);

            text.textContent = `Target ${target} siswa, submit valid ${submittedInTarget}, belum start ${notStarted}, sudah start belum submit ${startedNotSubmitted}.`;
            badges.innerHTML = `
                <span class="badge badge-success">Submit: ${submittedInTarget}/${target}</span>
                <span class="badge badge-warning">Belum Start: ${notStarted}</span>
                <span class="badge badge-danger">Start Belum Submit: ${startedNotSubmitted}</span>
                ${outsideTarget > 0 ? `<span class="badge badge-danger">Di luar target: ${outsideTarget}</span>` : ''}
            `;

            const messages = [];
            if (notStarted > 0) messages.push(`${notStarted} siswa target belum pernah membuat sesi ujian.`);
            if (startedNotSubmitted > 0) messages.push(`${startedNotSubmitted} siswa sudah punya sesi tetapi belum submitted.`);
            if (outsideTarget > 0) messages.push(`${outsideTarget} hasil submitted berada di luar target kelas/peserta saat ini.`);

            if (messages.length > 0) {
                warning.style.display = 'block';
                warning.innerHTML = `<i class="fas fa-triangle-exclamation"></i> ${messages.join(' ')}`;
            } else {
                warning.style.display = 'none';
                warning.textContent = '';
            }
            card.style.display = 'block';
        }

        function hideParticipationSummary() {
            const card = document.getElementById('participation-summary-card');
            if (card) card.style.display = 'none';
            currentParticipationSummary = null;
        }

        function renderResults(results) {
            const tbody = document.getElementById('results-table');

            if (results.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><i class="fas fa-inbox"></i><p>Belum ada hasil ujian</p></div></td></tr>';
                return;
            }

            tbody.innerHTML = results.map((r, idx) => `
                <tr>
                    <td>${idx + 1}</td>
                    <td><strong>${r.user.full_name}</strong><br><small style="color: var(--text-secondary);">@${r.user.username}${r.user.student_class ? ` | ${r.user.student_class}` : ''}</small></td>
                    <td>${r.exam.title}<br><small style="color: var(--text-secondary);">${r.exam.subject || ''} ${r.exam.exam_type ? `(${r.exam.exam_type})` : ''}</small></td>
                    <td><strong style="font-size: 1.25rem; color: ${r.score >= (r.exam.passing_score || 70) ? 'var(--success)' : 'var(--danger)'};">${r.score}</strong></td>
                    <td><span class="badge badge-${r.passed ? 'success' : 'danger'}">${r.passed ? 'Lulus' : 'Tidak Lulus'}</span></td>
                    <td>${formatDate(r.submitted_at)}</td>
                    <td><button class="btn btn-sm btn-secondary" onclick="showDetail(${r.id})"><i class="fas fa-eye"></i></button></td>
                </tr>
            `).join('');
        }

        function filterResults() {
            const search = document.getElementById('search-input').value.toLowerCase();
            const status = document.getElementById('status-filter').value;
            const sort = document.getElementById('sort-filter').value;

            let filtered = allResults.filter(r => {
                const matchSearch = r.user.full_name.toLowerCase().includes(search);
                const matchStatus = !status || (status === 'passed' ? r.passed : !r.passed);
                return matchSearch && matchStatus;
            });

            // Apply sorting
            switch (sort) {
                case 'score-desc':
                    filtered.sort((a, b) => b.score - a.score);
                    break;
                case 'score-asc':
                    filtered.sort((a, b) => a.score - b.score);
                    break;
                case 'name-asc':
                    filtered.sort((a, b) => a.user.full_name.localeCompare(b.user.full_name));
                    break;
                case 'time-desc':
                    filtered.sort((a, b) => new Date(b.submitted_at) - new Date(a.submitted_at));
                    break;
            }

            renderResults(filtered);
        }

        document.getElementById('search-input').addEventListener('input', filterResults);
        document.getElementById('status-filter').addEventListener('change', filterResults);
        document.getElementById('sort-filter').addEventListener('change', filterResults);

        async function ensureExamBreakdownLoaded(examId) {
            const normalizedExamId = Number(examId);
            if (!normalizedExamId || examBreakdownLoaded.has(normalizedExamId)) {
                return;
            }

            const fullResults = await api.getExamResults(normalizedExamId, true);
            const byId = new Map(fullResults.map((item) => [item.id, item]));
            allResults = allResults.map((item) => {
                const richer = byId.get(item.id);
                return richer
                    ? {
                        ...richer,
                        duration_taken: richer.duration_seconds ? Math.round(richer.duration_seconds / 60) : 0
                    }
                    : item;
            });
            examBreakdownLoaded.add(normalizedExamId);
        }

        async function showDetail(id) {
            let result = allResults.find(r => r.id === id);
            if (!result) return;

            const hasBreakdown = Array.isArray(result?.session_metadata?.score_breakdown)
                && result.session_metadata.score_breakdown.length > 0;
            if (!hasBreakdown && currentExam?.id) {
                try {
                    await ensureExamBreakdownLoaded(currentExam.id);
                    result = allResults.find(r => r.id === id) || result;
                } catch (error) {
                    console.warn('Gagal memuat rincian soal saat buka detail:', error);
                }
            }

            // Render score breakdown if available
            let breakdownHtml = '';
            // Check session_metadata (might be nested in result object depending on API)
            // The API returns ExamSession schema which has session_metadata
            const metadata = result.session_metadata || {};

            if (metadata.score_breakdown && metadata.score_breakdown.length > 0) {
                const formatPoints = (value) => {
                    if (value === null || value === undefined || Number.isNaN(Number(value))) return '-';
                    const n = Number(value);
                    const rounded = Math.round(n * 100) / 100;
                    return Number.isInteger(rounded) ? String(rounded) : String(rounded);
                };

                const renderStatus = (q) => {
                    if (q.status === 'pending') {
                        return '<span style="color: #f59e0b;">Menunggu</span>';
                    }
                    if (q.status === 'partial') {
                        return '<span style="color: #f59e0b;">Parsial</span>';
                    }
                    if (q.status === 'not_answered') {
                        return '<span style="color: var(--text-secondary);">- Kosong</span>';
                    }
                    if (q.status === 'correct' || q.is_correct === true) {
                        return '<span style="color: var(--success);">✓ Benar</span>';
                    }
                    if (q.status === 'incorrect' || q.is_correct === false) {
                        return '<span style="color: var(--danger);">✗ Salah</span>';
                    }

                    // Backward-compatibility for old score_breakdown records without `status`
                    if (q.points_earned === null || q.points_earned === undefined) {
                        return '<span style="color: #f59e0b;">Menunggu</span>';
                    }
                    return q.is_correct
                        ? '<span style="color: var(--success);">✓ Benar</span>'
                        : '<span style="color: var(--danger);">✗ Salah</span>';
                };

                const rows = metadata.score_breakdown.map((q, idx) => `
                    <tr style="border-bottom: 1px solid rgba(255,255,255,0.05);">
                        <td style="padding: 8px;">Q${idx + 1} <span style="font-size: 0.8em; color: var(--text-secondary);">(${q.question_type})</span></td>
                        <td style="padding: 8px; text-align: center;">
                            ${renderStatus(q)}
                        </td>
                        <td style="padding: 8px; text-align: right;">
                            ${formatPoints(q.points_earned)} <span style="color: var(--text-secondary);">/ ${formatPoints(q.max_points)}</span>
                        </td>
                    </tr>
                `).join('');

                breakdownHtml = `
                    <div class="card" style="margin-top: 1rem;">
                        <h4 style="margin-bottom: 0.75rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.5rem;">
                            Rincian Nilai Per Soal
                        </h4>
                        <table style="width: 100%; border-collapse: collapse; font-size: 0.9rem;">
                            <thead>
                                <tr style="background: rgba(255,255,255,0.05); text-align: left;">
                                    <th style="padding: 8px;">Soal</th>
                                    <th style="padding: 8px; text-align: center;">Status</th>
                                    <th style="padding: 8px; text-align: right;">Poin</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${rows}
                            </tbody>
                            <tfoot>
                                <tr style="border-top: 1px solid rgba(255,255,255,0.2); font-weight: bold;">
                                    <td style="padding: 8px;">Total</td>
                                    <td style="padding: 8px;"></td>
                                    <td style="padding: 8px; text-align: right;">
                                        ${result.score} <span style="font-weight: normal; color: var(--text-secondary);">(Skor)</span>
                                    </td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                `;
            }

            document.getElementById('detail-content').innerHTML = `
                <div style="display: grid; gap: 1rem;">
                    <div style="display: flex; align-items: center; gap: 1rem; padding: 1rem; background: var(--dark-card); border-radius: 0.5rem;">
                        <div class="user-avatar" style="width: 60px; height: 60px; font-size: 1.5rem;">${result.user.full_name.charAt(0)}</div>
                        <div>
                            <h3>${result.user.full_name}</h3>
                            <p style="color: var(--text-secondary);">@${result.user.username}</p>
                        </div>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="card" style="text-align: center;">
                            <p style="color: var(--text-secondary); margin-bottom: 0.5rem;">Nilai</p>
                            <h2 style="font-size: 2.5rem; color: ${result.score >= (result.exam.passing_score || 70) ? 'var(--success)' : 'var(--danger)'};">${result.score}</h2>
                        </div>
                        <div class="card" style="text-align: center;">
                            <p style="color: var(--text-secondary); margin-bottom: 0.5rem;">Status</p>
                            <span class="badge badge-${result.passed ? 'success' : 'danger'}" style="font-size: 1rem; padding: 0.5rem 1rem;">${result.passed ? 'LULUS' : 'TIDAK LULUS'}</span>
                        </div>
                    </div>
                    <div class="card">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
                            <div><strong>Ujian:</strong></div><div>${result.exam.title}</div>
                            <div><strong>Bidang Studi:</strong></div><div>${result.exam.subject || '-'}</div>
                            <div><strong>Tipe Ujian:</strong></div><div>${result.exam.exam_type || '-'}</div>
                            <div><strong>Kelas:</strong></div><div>${result.user.student_class || '-'}</div>
                            <div><strong>Passing Score:</strong></div><div>${result.exam.passing_score || 70}</div>
                            <div><strong>Durasi:</strong></div><div>${result.duration_taken} menit</div>
                            <div><strong>Selesai:</strong></div><div>${formatDate(result.submitted_at)}</div>
                        </div>
                    </div>
                    <div style="display:flex; justify-content:flex-end;">
                        <button class="btn btn-primary btn-sm" onclick="openAnswerReview(${result.id})">
                            <i class="fas fa-clipboard-check"></i> Review Jawaban
                        </button>
                    </div>
                    ${breakdownHtml}
                </div>
            `;
            openModal('detail-modal');
        }

        async function openAnswerReview(sessionId) {
            if (!currentExam || !currentExam.id) {
                showAlert('Pilih ujian terlebih dahulu', 'warning');
                return;
            }

            const cacheKey = `${currentExam.id}:${sessionId}`;
            const reviewContent = document.getElementById('review-content');
            closeModal('detail-modal');
            reviewContent.innerHTML = `
                <div class="loading" style="padding: 2rem 0;">
                    <div class="spinner"></div>
                </div>
            `;
            openModal('review-modal');

            try {
                let payload = sessionReviewCache.get(cacheKey);
                if (!payload) {
                    payload = await api.getSessionAnswerReview(currentExam.id, sessionId);
                    sessionReviewCache.set(cacheKey, payload);
                }
                activeReviewPayload = payload;
                activeReviewFilter = 'all';
                activeReviewSearch = '';
                renderActiveReviewPayload();
            } catch (error) {
                console.error('Gagal memuat review jawaban:', error);
                reviewContent.innerHTML = `
                    <div class="empty-state" style="padding: 1.5rem 0;">
                        <i class="fas fa-triangle-exclamation"></i>
                        <p>Gagal memuat review jawaban.</p>
                        <small>${escapeHtml(error.message || 'Silakan coba lagi')}</small>
                    </div>
                `;
            }
        }

            activeReviewFilter = status;
            renderActiveReviewPayload();
        }

            activeReviewSearch = String(value || '').toLowerCase().trim();
            renderActiveReviewPayload();
        }

        function getReviewStatusBadge(status) {
            const map = {
                correct: { label: 'Benar', className: 'badge-success' },
                partial: { label: 'Parsial', className: 'badge-warning' },
                incorrect: { label: 'Salah', className: 'badge-danger' },
                pending: { label: 'Menunggu', className: 'badge-warning' },
                not_answered: { label: 'Kosong', className: 'badge-secondary' }

        function renderActiveReviewPayload() {
            const payload = activeReviewPayload;
            const reviewContent = document.getElementById('review-content');
            if (!payload) {
                reviewContent.innerHTML = `
                    <div class="empty-state" style="padding: 1rem 0;">
                        <i class="fas fa-circle-info"></i>
                        <p>Data review belum tersedia.</p>
                    </div>
                `;
                return;
            }

            const statusPriority = ['incorrect', 'partial', 'pending', 'not_answered', 'correct'];
            let questions = Array.isArray(payload.questions) ? [...payload.questions] : [];
            if (activeReviewFilter !== 'all') {
                questions = questions.filter((item) => item.status === activeReviewFilter);
            }
            if (activeReviewSearch) {
                questions = questions.filter((item) => {
                    const hay = [
                        item.question_text,
                        item.student_answer_display,
                        item.answer_key_display
                    ].join(' ').toLowerCase();
                    return hay.includes(activeReviewSearch);
                });

            questions.sort((a, b) => {
                const pa = statusPriority.indexOf(a.status);
                const pb = statusPriority.indexOf(b.status);
                if (pa !== pb) return pa - pb;
                return (a.order_index || 0) - (b.order_index || 0);
            });

            const summary = payload.summary || {};

                                <span class="badge badge-primary">Skor ${score.toFixed(2)} / KKM ${passing}</span>
                            </div>
                        </div>
                    </div>

                    <div class="review-mini-kpi">
                        <div class="item"><div style="font-size:0.72rem;color:var(--text-secondary);">Total Soal</div><div style="font-weight:700;font-size:1.05rem;">${summary.total_questions || 0}</div></div>
                        <div class="item"><div style="font-size:0.72rem;color:var(--text-secondary);">Benar</div><div style="font-weight:700;font-size:1.05rem;color:#22c55e;">${summary.correct || 0}</div></div>
                        <div class="item"><div style="font-size:0.72rem;color:var(--text-secondary);">Parsial</div><div style="font-weight:700;font-size:1.05rem;color:#f59e0b;">${summary.partial || 0}</div></div>
                        <div class="item"><div style="font-size:0.72rem;color:var(--text-secondary);">Salah</div><div style="font-weight:700;font-size:1.05rem;color:#ef4444;">${summary.incorrect || 0}</div></div>
                        <div class="item"><div style="font-size:0.72rem;color:var(--text-secondary);">Kosong</div><div style="font-weight:700;font-size:1.05rem;">${summary.unanswered || 0}</div></div>
                        <div class="item"><div style="font-size:0.72rem;color:var(--text-secondary);">Menunggu Nilai</div><div style="font-weight:700;font-size:1.05rem;">${summary.pending || 0}</div></div>
                    </div>

                    <div class="card" style="padding:0.9rem;">
                        <div class="review-toolbar">
                            <button class="review-filter-btn ${activeReviewFilter === 'all' ? 'active' : ''}" onclick="setReviewFilter('all')">Semua</button>
                            <button class="review-filter-btn ${activeReviewFilter === 'incorrect' ? 'active' : ''}" onclick="setReviewFilter('incorrect')">Salah</button>
                            <button class="review-filter-btn ${activeReviewFilter === 'partial' ? 'active' : ''}" onclick="setReviewFilter('partial')">Parsial</button>
                            <button class="review-filter-btn ${activeReviewFilter === 'pending' ? 'active' : ''}" onclick="setReviewFilter('pending')">Pending</button>
                            <button class="review-filter-btn ${activeReviewFilter === 'not_answered' ? 'active' : ''}" onclick="setReviewFilter('not_answered')">Kosong</button>
                            <button class="review-filter-btn ${activeReviewFilter === 'correct' ? 'active' : ''}" onclick="setReviewFilter('correct')">Benar</button>
                            <div class="search-box" style="margin-left:auto; min-width: 220px;">
                                <i class="fas fa-magnifying-glass"></i>
                                <input type="text" class="form-control" placeholder="Cari teks soal/jawaban..." value="${escapeHtml(activeReviewSearch)}" oninput="handleReviewSearchInput(this.value)">
                            </div>

        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const anchor = document.createElement('a');
            anchor.href = url;
            anchor.download = filename;
            anchor.click();
            URL.revokeObjectURL(url);
        }

        function downloadFile(content, filename, mimeType) {
            const blob = new Blob(['\ufeff' + content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        function calculateStats() {
            if (allResults.length === 0) return { total: 0, passed: 0, failed: 0, passRate: 0, average: 0, highest: 0, lowest: 0 };

            const scores = allResults.map(r => r.score);
            const passed = allResults.filter(r => r.passed).length;
            const failed = allResults.length - passed;

            return {
                total: allResults.length,
                passed: passed,
                failed: failed,
                passRate: Math.round((passed / allResults.length) * 100),
                average: Math.round(scores.reduce((a, b) => a + b, 0) / scores.length),
                highest: Math.max(...scores),
                lowest: Math.min(...scores)
            };
        }

        function exportSummary() {
            if (allResults.length === 0) {
                showAlert('Tidak ada data untuk diekspor', 'warning');
                return;
            }

            const stats = calculateStats();
            const examTitle = currentExam?.title || 'Semua Ujian';

            // Calculate score distribution
            const distribution = {
                'A (90-100)': allResults.filter(r => r.score >= 90).length,
                'B (80-89)': allResults.filter(r => r.score >= 80 && r.score < 90).length,
                'C (70-79)': allResults.filter(r => r.score >= 70 && r.score < 80).length,
                'D (60-69)': allResults.filter(r => r.score >= 60 && r.score < 70).length,
                'E (<60)': allResults.filter(r => r.score < 60).length
            };

            let summary = `RINGKASAN HASIL UJIAN\n`;
            summary += `${'='.repeat(50)}\n\n`;
            summary += `Ujian: ${examTitle}\n`;
            summary += `Guru Pelaksana: ${currentExam?.teacher_name || '-'}\n`;
            summary += `KKM / Passing Score: ${currentExam?.passing_score || 70}\n`;
            summary += `Tanggal Export: ${new Date().toLocaleString('id-ID')}\n\n`;

            summary += `STATISTIK UMUM\n`;
            summary += `${'─'.repeat(30)}\n`;
            summary += `Total Peserta      : ${stats.total}\n`;
            summary += `Jumlah Lulus       : ${stats.passed} (${stats.passRate}%)\n`;
            summary += `Jumlah Tidak Lulus : ${stats.failed}\n`;
            summary += `Nilai Rata-rata    : ${stats.average}\n`;
            summary += `Nilai Tertinggi    : ${stats.highest}\n`;
            summary += `Nilai Terendah     : ${stats.lowest}\n\n`;

            summary += `DISTRIBUSI NILAI\n`;
            summary += `${'─'.repeat(30)}\n`;
            for (const [grade, count] of Object.entries(distribution)) {
                const bar = '█'.repeat(Math.round(count / stats.total * 20)) || '';
                summary += `${grade.padEnd(12)} : ${String(count).padStart(3)} ${bar}\n`;
            }

            summary += `\n${'='.repeat(50)}\n`;
            summary += `Diekspor dari Sistem Ujian Online\n`;

            const filename = `ringkasan_${examTitle.replace(/\s+/g, '_')}_${new Date().toISOString().slice(0, 10)}.txt`;
            downloadFile(summary, filename, 'text/plain;charset=utf-8;');
            showAlert('Ringkasan statistik berhasil diexport', 'success');
        }

        function getQuestionTypeName(type) {
            const types = {
                'multiple_choice': 'Pilihan Ganda',
                'essay': 'Essay',
                'short_answer': 'Jawaban Singkat',
                'true_false': 'Benar/Salah',
                'matching': 'Menjodohkan',
                'pg_kompleks': 'PG Kompleks'
            };
            return types[type] || type;
        }

        function getOptionText(option) {
            return option?.option_text || option?.text || option || '';
        }

        function getQuestionOptionsFormatted(question) {
            const options = Array.isArray(question.options) ? [...question.options] : [];
            options.sort((a, b) => (a.order_index || 0) - (b.order_index || 0));
            return options.map((opt, idx) => ({
                id: opt.id,
                label: String.fromCharCode(65 + (idx % 26)),
                text: getOptionText(opt),
                is_correct: opt.is_correct === true
            }));
        }

        function getQuestionAnswerKeyDisplay(question) {
            const settings = question.question_settings || {};
            const type = question.question_type;

            if (type === 'multiple_choice' || type === 'true_false') {
                const options = getQuestionOptionsFormatted(question);
                const correct = options.find((o) => o.is_correct);
                return correct ? `${correct.label}. ${correct.text}` : '-';
            }

            if (type === 'multiple_choice_complex') {
                const pgkType = question.pgk_type || settings.pgk_type || 'checkbox';
                if (pgkType === 'table_validation') {
                    const statements = Array.isArray(settings.statements) ? settings.statements : [];
                    const answers = Array.isArray(settings.statement_answers) ? settings.statement_answers : [];
                    if (!statements.length) return '-';
                    return statements.map((statement, idx) => {
                        const text = typeof statement === 'object'
                            ? (statement.text || statement.statement || `Pernyataan ${idx + 1}`)
                            : statement;
                        const value = answers[idx];
                        return `${idx + 1}. ${text}: ${value === true ? 'Benar' : (value === false ? 'Salah' : '-')}`;
                    }).join(' | ');
                }
                const options = getQuestionOptionsFormatted(question).filter((o) => o.is_correct);
                if (!options.length) return '-';
                return options.map((o) => `${o.label}. ${o.text}`).join(', ');
            }

            if (type === 'short_answer') {
                const acceptable = Array.isArray(settings.acceptable_answers) ? settings.acceptable_answers : [];
                return acceptable.length ? acceptable.join(' / ') : '-';
            }

            if (type === 'essay') {
                return settings.answer_key || settings.sample_answer || '-';
            }

            return '-';
        }

        function renderQuestionOptionsHtml(question) {
            const type = question.question_type;
            if (type === 'true_false') {
                return '<div class="opt-row">A. Benar</div><div class="opt-row">B. Salah</div>';
            }
            if (type === 'multiple_choice' || type === 'multiple_choice_complex') {
                const options = getQuestionOptionsFormatted(question);
                if (!options.length) return '<div class="opt-row">-</div>';
                return options.map((opt) => `<div class="opt-row">${escapeHtml(opt.label)}. ${escapeHtml(opt.text || '-')}</div>`).join('');
            }
            return '<div class="opt-row">-</div>';
        }

            printWindow.document.close();
            printWindow.onload = function () { printWindow.print(); };
            showAlert('PDF soal dibuka di tab baru. Gunakan Save as PDF untuk simpan dokumen formal.', 'success');
        }

        function exportQuestionsDOCX(exam, questions, logoDataUrl) {
            const content = buildQuestionExportHTML(exam, questions, logoDataUrl);
            const blob = new Blob(['\ufeff' + content], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `soal_dan_kunci_${slugifyFilename(exam.title)}_${new Date().toISOString().slice(0, 10)}.doc`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showAlert('Dokumen Word soal + kunci berhasil didownload', 'success');
        }

        function exportQuestionsExcel(exam, questions, logoDataUrl) {
            const logoHtml = logoDataUrl
                ? `<img src="${logoDataUrl}" alt="Logo" style="width:64px;height:64px;object-fit:contain;" />`
                : '';
            let html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel">
            <head><meta charset="utf-8"><style>
            body{font-family:Arial,sans-serif;}
            table{border-collapse:collapse;}
            th,td{border:1px solid #000;padding:8px;vertical-align:top;}
            th{background:#0f172a;color:white;font-weight:bold;}
            .key{background:#ecfdf5;}
            </style></head><body>
            <table style="border:none; width:100%; margin-bottom:10px;">
                <tr>
                    <td style="border:none; width:80px; text-align:center;">${logoHtml}</td>
                    <td style="border:none;">
                        <div style="font-size:14pt;font-weight:bold;">${EXPORT_BRANDING.schoolName}</div>
                        <div style="font-size:10pt;color:#334155;">${EXPORT_BRANDING.reportSubtitle}</div>
                        <div style="font-size:11pt;font-weight:bold;">DAFTAR SOAL DAN KUNCI JAWABAN</div>
                    </td>
                </tr>
            </table>
            <table style="border:none;margin-bottom:14px;">
                <tr><td style="border:none;font-weight:bold;">Judul Ujian</td><td style="border:none;">: ${escapeHtml(exam.title || '-')}</td></tr>
                <tr><td style="border:none;font-weight:bold;">Mata Pelajaran</td><td style="border:none;">: ${escapeHtml(exam.subject || '-')}</td></tr>
                <tr><td style="border:none;font-weight:bold;">Durasi</td><td style="border:none;">: ${exam.duration_minutes} menit</td></tr>
                <tr><td style="border:none;font-weight:bold;">Jumlah Soal</td><td style="border:none;">: ${questions.length}</td></tr>
            </table>
            <table><tr><th>No</th><th>Tipe Soal</th><th>Pertanyaan</th><th>Opsi</th><th>Kunci Jawaban</th><th>Poin</th></tr>`;

            questions.forEach((q, idx) => {
                const options = renderQuestionOptionsHtml(q).replace(/class="opt-row"/g, 'style="margin-bottom:2px;"');
                const answerKey = getQuestionAnswerKeyDisplay(q);
                html += `<tr>
                    <td style="text-align:center;">${idx + 1}</td>
                    <td>${escapeHtml(getQuestionTypeName(q.question_type))}</td>
                    <td>${escapeHtml(q.question_text || '-')}</td>
                    <td>${options}</td>
                    <td class="key">${escapeHtml(answerKey)}</td>

            html += `</table></body></html>`;
            const blob = new Blob(['\ufeff' + html], { type: 'application/vnd.ms-excel' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `soal_dan_kunci_${slugifyFilename(exam.title)}_${new Date().toISOString().slice(0, 10)}.xls`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showAlert('Excel soal + kunci berhasil didownload', 'success');
        }

        async function deleteAllResults() {
            console.log('[DELETE] Initiating delete all results for exam:', currentExam?.id);

            if (!currentExam || !currentExam.id) {
                showAlert('Pilih ujian terlebih dahulu', 'warning');
                console.error('[DELETE] No exam selected');
                return;
            }

            const examTitle = document.getElementById('active-exam-title')?.textContent || 'ujian ini';
            const totalResults = document.getElementById('total-participants')?.textContent || '0';

            console.log(`[DELETE] Exam: ${examTitle}, Total results: ${totalResults}`);

            // Use native confirm for better reliability
            const confirmed = confirm(
                `⚠️ HAPUS SEMUA HASIL UJIAN\n\n` +
                `Hapus semua ${totalResults} hasil ujian untuk "${examTitle}"?\n\n` +
                `Tindakan ini tidak dapat dibatalkan!`
            );

            if (!confirmed) {
                console.log('[DELETE] User cancelled deletion');
                return;
            }


            // Show loading state
            const deleteBtn = document.getElementById('delete-results-btn');
            const originalBtnHtml = deleteBtn?.innerHTML;
            if (deleteBtn) {
                deleteBtn.disabled = true;
                deleteBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menghapus...';
            }

            try {
                console.log(`[DELETE] Sending DELETE request to /api/exams/${currentExam.id}/results`);

                const token = localStorage.getItem('access_token');
                const response = await fetch(`/api/exams/${currentExam.id}/results`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                console.log(`[DELETE] Response status: ${response.status}`);

                if (response.ok) {
                    const result = await response.json();
                    console.log('[DELETE] Success:', result);

                    showAlert(`${result.message || 'Hasil ujian berhasil dihapus'}`, 'success');

                    // Reload results to show empty state
                    console.log('[DELETE] Reloading exam results...');
                    await loadResults(currentExam.id);
                } else {
                    const error = await response.json().catch(() => ({ detail: 'Unknown error' }));
                    console.error('[DELETE] Error response:', error);
                    showAlert(`${error.detail || 'Gagal menghapus hasil'}`, 'danger');
                }
            } catch (error) {
                console.error('[DELETE] Exception:', error);
                showAlert(`Terjadi kesalahan: ${error.message}`, 'danger');
            } finally {
                // Restore button state
                if (deleteBtn) {
                    deleteBtn.disabled = false;
                    deleteBtn.innerHTML = originalBtnHtml || '<i class="fas fa-trash-can"></i> Hapus Hasil';
                }
                console.log('[DELETE] Operation complete');
            }
        }

        // ===== BULK SELECTION FUNCTIONS =====

        function toggleCheckboxMode() {
            checkboxMode = !checkboxMode;
            const btn = document.getElementById('checkbox-mode-btn');
            const bulkControls = document.getElementById('bulk-controls');

            if (checkboxMode) {
                btn.innerHTML = '<i class="fas fa-times"></i> Batal Mode Pilih';
                btn.classList.remove('btn-secondary');
                btn.classList.add('btn-primary');
                bulkControls.style.display = 'flex';
            } else {
                btn.innerHTML = '<i class="fas fa-check-square"></i> Mode Pilih';
                btn.classList.remove('btn-primary');
                btn.classList.add('btn-secondary');
                bulkControls.style.display = 'none';
                selectedExamIds.clear();
            }

            renderExamCards(allExams);
            updateSelectionCount();
        }

        function toggleExamSelection(examId, event) {
            event.stopPropagation();

            if (selectedExamIds.has(examId)) {
                selectedExamIds.delete(examId);
            } else {
                selectedExamIds.add(examId);
            }

            renderExamCards(allExams);
            updateSelectionCount();
        }

        function selectAllExams() {
            allExams.forEach(exam => selectedExamIds.add(exam.id));
            renderExamCards(allExams);
            updateSelectionCount();
        }

        function deselectAllExams() {
            selectedExamIds.clear();
            renderExamCards(allExams);
            updateSelectionCount();
        }

        function updateSelectionCount() {
            const count = selectedExamIds.size;
            const countElement = document.getElementById('selected-exam-count');
            const deleteBtn = document.getElementById('delete-selected-btn');

            if (countElement) {
                countElement.textContent = count;
            }
            if (deleteBtn) {
                deleteBtn.disabled = count === 0;
            }
        }

        async function deleteSelectedExams() {
            if (selectedExamIds.size === 0) return;

            const count = selectedExamIds.size;
            const confirmed = confirm(
                `⚠️ HAPUS ${count} UJIAN\n\n` +
                `Anda akan menghapus ${count} ujian beserta semua hasil ujian di dalamnya.\n\n` +
                `Tindakan ini tidak dapat dibatalkan!\n\n` +
                `Lanjutkan?`
            );

            if (!confirmed) return;

            // Show loading
            const deleteBtn = document.getElementById('delete-selected-btn');
            const originalHtml = deleteBtn.innerHTML;
            deleteBtn.disabled = true;
            deleteBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menghapus...';

            let successCount = 0;
            let failCount = 0;

            try {
                const token = localStorage.getItem('access_token');
                const examIds = Array.from(selectedExamIds);

                // Delete exams sequentially
                for (const examId of examIds) {
                    try {
                        const response = await fetch(`/api/exams/${examId}`, {
                            method: 'DELETE',
                            headers: {
                                'Authorization': `Bearer ${token}`,
                                'Content-Type': 'application/json'
                            }
                        });

                        if (response.ok || response.status === 204) {
                            successCount++;
                        } else {
                            failCount++;
                            console.error(`Failed to delete exam ${examId}`);
                        }
                    } catch (error) {
                        failCount++;
                        console.error(`Error deleting exam ${examId}:`, error);
                    }
                }

                // Show result
                if (successCount > 0) {
                    showAlert(`Berhasil menghapus ${successCount} ujian`, 'success');
                }
                if (failCount > 0) {
                    showAlert(`${failCount} ujian gagal dihapus`, 'warning');
                }


                // Exit checkbox mode and clear selection
                checkboxMode = false;
                selectedExamIds.clear();

                // Update button states
                const modeBtn = document.getElementById('checkbox-mode-btn');
                const bulkControls = document.getElementById('bulk-controls');
                if (modeBtn) {
                    modeBtn.innerHTML = '<i class="fas fa-check-square"></i> Mode Pilih';
                    modeBtn.classList.remove('btn-primary');
                    modeBtn.classList.add('btn-secondary');
                }
                if (bulkControls) {
                    bulkControls.style.display = 'none';
                }

                // Reload exams
                await loadExams();

            } catch (error) {
                console.error('Bulk delete error:', error);
                showAlert('Terjadi kesalahan saat menghapus ujian', 'danger');
            } finally {
                deleteBtn.disabled = false;
                deleteBtn.innerHTML = originalHtml;
            }
        }

        loadExams();
    </script>
