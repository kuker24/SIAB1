<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/gif" href="/static/favicon.gif">
    <title>Media Library - Admin Dashboard</title>
    <link rel="stylesheet" href="/static/css/admin.css">
    <!-- Responsive -->
    <link rel="stylesheet" href="/static/css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar - Loaded via JavaScript -->
        <div id="sidebar-container"></div>

        <!-- Toast Notifications Container -->
        <div id="toast-container"></div>

        <!-- Main Content -->
        <main class="main-content">
            <header class="content-header">
                <div class="header-left">
                    <button class="sidebar-toggle" id="sidebar-toggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div class="header-title">
                        <h1><i class="fas fa-photo-film"></i> Media Library</h1>
                        <p>Kelola file gambar, video, dan dokumen</p>
                    </div>
                </div>
                <div class="header-right">
                    <button class="btn btn-primary" onclick="mediaLibrary.showUploadModal()">
                        <i class="fas fa-cloud-arrow-up"></i> Upload File
                    </button>
                </div>
            </header>

            <div class="content-body">
                <!-- Stats Cards -->
                <div class="stats-row" id="media-stats">
                    <div class="stat-card">
                        <div class="stat-icon bg-primary">
                            <i class="fas fa-file-lines"></i>
                        </div>
                        <div class="stat-details">
                            <span class="stat-value">-</span>
                            <span class="stat-label">Total File</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon bg-info">
                            <i class="fas fa-hard-drive"></i>
                        </div>
                        <div class="stat-details">
                            <span class="stat-value">-</span>
                            <span class="stat-label">Storage Digunakan</span>
                        </div>
                    </div>
                </div>

                <!-- Filters -->
                <div class="filter-bar">
                    <div class="search-box">
                        <i class="fas fa-magnifying-glass"></i>
                        <input type="text" id="media-search" placeholder="Cari file..." class="form-control">
                    </div>
                    <div class="filter-group">
                        <select id="media-type-filter" class="form-control">
                            <option value="">Semua Tipe</option>
                            <option value="image">Gambar</option>
                            <option value="video">Video</option>
                            <option value="audio">Audio</option>
                            <option value="document">Dokumen</option>
                        </select>
                    </div>
                </div>

                <!-- Media Grid -->
                <div id="media-grid" class="loading-skeleton">
                    <div class="skeleton-grid">
                        <div class="skeleton-card"></div>
                        <div class="skeleton-card"></div>
                        <div class="skeleton-card"></div>
                        <div class="skeleton-card"></div>
                        <div class="skeleton-card"></div>
                        <div class="skeleton-card"></div>
                    </div>
                </div>

                <!-- Pagination -->
                <div id="media-pagination" class="pagination-container mt-4"></div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="/static/js/api.js?v=20260306-phase4"></script>
    <script src="/static/js/auth.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
    <script src="/static/js/sidebar-loader.js"></script>
    <script src="/static/js/media-library.js?v=20260306-phase8"></script>
    <script>
        // Check auth
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await checkAuthAndRedirect(['admin', 'teacher']);
            if (!user) return;

            initSidebar();
            initMediaLibrary();
        });
    </script>

    <style>
        /* Media Library Specific Styles */
        .filter-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-box i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-box input {
            padding-left: 2.5rem;
        }

        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1rem;
        }

        .media-card {
            background: var(--bg-secondary);
            border-radius: 0.75rem;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid var(--border-color);
        }

        .media-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            border-color: var(--color-primary);
        }

        .media-thumbnail {
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-tertiary);
            position: relative;
            overflow: hidden;
        }

        .media-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .media-thumbnail i {
            color: var(--text-muted);
        }

        .media-type-badge {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            font-size: 0.7rem;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            text-transform: uppercase;
        }

        .media-info {
            padding: 0.75rem;
        }

        .media-name {
            display: block;
            font-weight: 500;
            color: var(--text-primary);
            font-size: 0.85rem;
            margin-bottom: 0.25rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .media-size {
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        /* Upload Modal Styles */
        .upload-zone {
            border: 2px dashed var(--border-color);
            border-radius: 1rem;
            padding: 3rem;
            text-align: center;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .upload-zone:hover,
        .upload-zone.drag-over {
            border-color: var(--color-primary);
            background: rgba(99, 102, 241, 0.05);
        }

        .upload-zone i {
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .upload-zone p {
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        .upload-hint {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .file-preview-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: var(--bg-tertiary);
            border-radius: 0.5rem;
            margin-bottom: 1rem;
        }

        .file-preview-item img {
            border-radius: 0.5rem;
            object-fit: cover;
        }

        .file-info {
            flex: 1;
        }

        .file-info strong {
            display: block;
            margin-bottom: 0.25rem;
        }

        .file-info span {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* File Details Modal */
        .file-details-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            .file-details-layout {
                grid-template-columns: 1fr;
            }
        }

        .file-preview-large {
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-tertiary);
            border-radius: 0.75rem;
            min-height: 200px;
            overflow: hidden;
        }

        .file-preview-large img {
            max-width: 100%;
            max-height: 300px;
            object-fit: contain;
        }

        .file-preview-large i {
            color: var(--text-muted);
        }

        .file-metadata {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .metadata-item {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .metadata-item label {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .url-copy {
            display: flex;
            gap: 0.5rem;
        }

        .url-copy input {
            flex: 1;
            font-size: 0.85rem;
            font-family: monospace;
        }

        /* Skeleton Loading */
        .skeleton-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1rem;
        }

        .skeleton-card {
            height: 180px;
            background: linear-gradient(90deg, var(--bg-tertiary) 25%, var(--bg-hover) 50%, var(--bg-tertiary) 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
            border-radius: 0.75rem;
        }

        @keyframes skeleton-loading {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }
    </style>
</body>

</html>
