# nginx.production.conf
# Nginx configuration for load balancing and reverse proxy

user nginx;
worker_processes 4;
worker_rlimit_nofile 65535;
worker_shutdown_timeout 10s;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        # Re-resolve Docker service DNS records so upstream IP changes after
        # container restarts do not leave stale destinations in Nginx workers.
        resolver 127.0.0.11 valid=10s ipv6=off;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    keepalive_requests 20000;
    send_timeout 120s;
    reset_timedout_connection on;
    types_hash_max_size 2048;

    # Upload settings - optimized for 600 concurrent users
    client_max_body_size 100M;
    client_body_timeout 300s;
    client_header_timeout 300s;

    # Buffering for uploads
    client_body_buffer_size 128k;
    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_buffer_size 128k;
    proxy_buffers 16 256k;
    proxy_busy_buffers_size 512k;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/x-javascript application/xml;

    # SafeLine overwrites X-Real-IP at the public trust boundary. The origin is
    # loopback-only, so no client can bypass SafeLine and inject this value.
    map $http_x_real_ip $client_real_ip {
        "" $remote_addr;
        default $http_x_real_ip;
    }
    map $http_x_real_ip $rate_limit_key {
        "" $binary_remote_addr;
        default $http_x_real_ip;
    }
    map $http_x_forwarded_proto $client_scheme {
        "" $scheme;
        ~*^http(?:,|$) http;
        ~*^https(?:,|$) https;
        default $scheme;
    }

    # Rate limiting zones
    # NOTE: Login/start intentionally queued, but login rate is kept high enough
    # for same-NAT classrooms (hundreds of users behind one public IP).
    # Redis/app lockout still enforces anti brute-force per account.
    limit_req_zone $rate_limit_key zone=api_limit:30m rate=480r/s;
    # NAT classroom tuning:
    # Keep coarse gateway protection in Nginx, but avoid artificial request delay
    # on login/start bursts. Fine-grained anti-bruteforce stays enforced per account
    # at app level (lockout + captcha + rate limiter keyed by username+IP).
    limit_req_zone $rate_limit_key zone=login_limit:30m rate=220r/s;
    limit_req_zone $rate_limit_key zone=join_limit:30m rate=120r/s;
    limit_req_zone $rate_limit_key zone=start_limit:30m rate=140r/s;
    limit_req_zone $rate_limit_key zone=poll_limit:30m rate=1600r/s;
    limit_req_zone $rate_limit_key zone=submit_limit:30m rate=1200r/s;
    limit_req_zone $rate_limit_key zone=admin_api_limit:20m rate=260r/s;
    # Heavy monitoring feeds can create DB pressure during active exam waves.
    # Keep a dedicated throttle so admin polling cannot starve exam hot paths.
    limit_req_zone $rate_limit_key zone=monitor_heavy_limit:20m rate=8r/s;

    # Upstream for FastAPI replicas with Docker service discovery.
    # Round-robin is more stable than least_conn for same-NAT burst classrooms.
    upstream fastapi_backend {
        zone fastapi_backend 64k;
        server api:8000 resolve max_fails=60 fail_timeout=5s;
        server api2:8000 resolve max_fails=60 fail_timeout=5s;
        server api3:8000 resolve max_fails=60 fail_timeout=5s;
        server api4:8000 resolve max_fails=60 fail_timeout=5s;
        server api5:8000 resolve max_fails=60 fail_timeout=5s;
        server api6:8000 resolve max_fails=60 fail_timeout=5s;
        server api7:8000 resolve max_fails=60 fail_timeout=5s;
        server api8:8000 resolve max_fails=60 fail_timeout=5s;
        keepalive 768;
    }

    upstream fastapi_control_backend {
        zone fastapi_control_backend 64k;
        server api_admin:8000 resolve max_fails=30 fail_timeout=5s;
        server api_admin2:8000 resolve max_fails=30 fail_timeout=5s;
        keepalive 256;
    }

    # Dedicated control lanes to separate admin and teacher operational traffic.
    upstream fastapi_admin_backend {
        zone fastapi_admin_backend 32k;
        server api_admin:8000 resolve max_fails=30 fail_timeout=5s;
        keepalive 128;
    }

    upstream fastapi_teacher_backend {
        zone fastapi_teacher_backend 32k;
        server api_admin2:8000 resolve max_fails=30 fail_timeout=5s;
        keepalive 128;
    }

    server {
        listen 80 default_server;
        server_name siab.man1rokanhulu.cloud;

        # Reuse upstream connections to FastAPI for lower latency under burst traffic.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # If one replica is rotating/restarting, retry idempotent requests to another replica.
        # This prevents brief "server down" symptoms during rolling maintenance.
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 30s;

        # Security headers are managed by FastAPI SecurityHeadersMiddleware
        # (app/middleware/security.py) to avoid duplication and conflicts.
        # DO NOT add security headers here - they will conflict with middleware headers.

        # Critical exam/admin scripts are served from disk so burst downloads
        # do not occupy FastAPI workers. Never sticky-cache these files.
        location = /static/js/exam-system.js {
            alias /usr/share/nginx/html/static/js/exam-system.js;
            default_type application/javascript;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
            add_header Pragma "no-cache";
        }

        location = /static/js/api.js {
            alias /usr/share/nginx/html/static/js/api.js;
            default_type application/javascript;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
            add_header Pragma "no-cache";
        }

        location = /static/js/auth.js {
            alias /usr/share/nginx/html/static/js/auth.js;
            default_type application/javascript;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
            add_header Pragma "no-cache";
        }

        location = /static/js/exam-builder.js {
            alias /usr/share/nginx/html/static/js/exam-builder.js;
            default_type application/javascript;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
            add_header Pragma "no-cache";
        }

        location = /admin/exam-builder.html {
            proxy_pass http://fastapi_control_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header X-Real-IP $client_real_ip;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        }

        # Keep admin UI/control traffic isolated from exam runtime traffic.
        location ^~ /admin/ {
            proxy_pass http://fastapi_control_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $client_real_ip;
            proxy_set_header X-Forwarded-Proto $client_scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # Drop common internet scanner paths before they hit FastAPI.
        location ~* ^/(wp-admin|wp-login\.php|wordpress|xmlrpc\.php|phpmyadmin|pma|\.env|\.git|vendor/phpunit|cgi-bin|boaform) {
            access_log off;
            return 404;
        }

        # ACME HTTP-01 challenge path for zero-downtime Let's Encrypt renewals.
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
            try_files $uri =404;
        }

        location ^~ /static/uploads/ {
            alias /usr/share/nginx/html/static/uploads/;
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
        }

        location /static/ {
            alias /usr/share/nginx/html/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # SEB config files
        location ~ \.seb$ {
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $client_real_ip;
            proxy_set_header X-Forwarded-Proto $client_scheme;

            # Allow SEB config download without rate limiting
        }

        # ==========================
        # Namespaced API Role Lanes
        # ==========================
        # External:
        # - /api/student/* -> student/data plane
        # - /api/control/* -> control plane (unknown role pre-login)
        # - /api/admin/*   -> admin-dedicated control lane
        # - /api/pengawas/* -> proctor-dedicated monitor lane
        # - /api/teacher/* -> teacher-dedicated control lane
        # Internal rewrite target remains /api/* to keep FastAPI routes backward compatible.

        # Role-lane login endpoints
        location ~ ^/api/control/auth/(login|signin)$ {
            limit_req zone=login_limit burst=2400 nodelay;
            limit_req_status 429;

            proxy_pass http://fastapi_control_backend/api/auth/control/$1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $client_real_ip;
            proxy_set_header X-Forwarded-Proto $client_scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
        }

        location ~ ^/api/admin/auth/(login|signin)$ {
            limit_req zone=login_limit burst=1800 nodelay;
            limit_req_status 429;

            proxy_pass http://fastapi_admin_backend/api/auth/admin/$1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $client_real_ip;
            proxy_set_header X-Forwarded-Proto $client_scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
        }

        location ~ ^/api/teacher/auth/(login|signin)$ {
            limit_req zone=login_limit burst=1800 nodelay;
            limit_req_status 429;

            proxy_pass http://fastapi_teacher_backend/api/auth/teacher/$1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $client_real_ip;
            proxy_set_header X-Forwarded-Proto $client_scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
        }

        location ~ ^/api/pengawas/auth/(login|signin)$ {
            limit_req zone=login_limit burst=1800 nodelay;
            limit_req_status 429;

            proxy_pass http://fastapi_teacher_backend/api/auth/pengawas/$1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $client_real_ip;
            proxy_set_header X-Forwarded-Proto $client_scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
        }

        location ~ ^/api/student/auth/(login|signin)$ {
            limit_req zone=login_limit burst=2400 nodelay;
            limit_req_status 429;

            proxy_pass http://fastapi_backend/api/auth/student/$1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $client_real_ip;
            proxy_set_header X-Forwarded-Proto $client_scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
        }

        # Namespaced role lanes for all other API calls
        location ~ ^/api/control/(.+)$ {
            limit_req zone=admin_api_limit burst=900;
            limit_req_status 429;

            proxy_pass http://fastapi_control_backend/api/$1$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $client_real_ip;
            proxy_set_header X-Forwarded-Proto $client_scheme;
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 30s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # Backward-compatible admin security lane.
        # Keep full URI (/api/admin/security/*) because backend routes still use that prefix.
        location ^~ /api/admin/security/ {
            limit_req zone=admin_api_limit burst=900;
            limit_req_status 429;

            proxy_pass http://fastapi_admin_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $client_real_ip;
            proxy_set_header X-Forwarded-Proto $client_scheme;
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 30s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        location ~ ^/api/admin/(.+)$ {
            limit_req zone=admin_api_limit burst=900;
            limit_req_status 429;

            proxy_pass http://fastapi_admin_backend/api/$1$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $client_real_ip;
            proxy_set_header X-Forwarded-Proto $client_scheme;
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 30s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        location ~ ^/api/teacher/(.+)$ {
            limit_req zone=admin_api_limit burst=900;
            limit_req_status 429;

            proxy_pass http://fastapi_teacher_backend/api/$1$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $client_real_ip;
            proxy_set_header X-Forwarded-Proto $client_scheme;
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 30s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        location ~ ^/api/pengawas/(.+)$ {
            limit_req zone=admin_api_limit burst=900;
            limit_req_status 429;

            proxy_pass http://fastapi_teacher_backend/api/$1$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $client_real_ip;
            proxy_set_header X-Forwarded-Proto $client_scheme;
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 30s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        location ~ ^/api/student/(.+)$ {
            limit_req zone=api_limit burst=1800;
            limit_req_status 429;

            proxy_pass http://fastapi_backend/api/$1$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $client_real_ip;
            proxy_set_header X-Forwarded-Proto $client_scheme;
            proxy_connect_timeout 90s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # Login endpoints (signin/login) - dedicated profile for burst NAT classrooms.
        location ~ ^/api/auth/(login|signin)$ {
            limit_req zone=login_limit burst=2400 nodelay;
            limit_req_status 429;

            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $client_real_ip;
            proxy_set_header X-Forwarded-Proto $client_scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
        }

        # Join endpoint - queue burst to avoid DB thundering herd after login wave.
        location = /api/exams/join {
            limit_req zone=join_limit burst=1800 nodelay;
            limit_req_status 429;

            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $client_real_ip;
            proxy_set_header X-Forwarded-Proto $client_scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
        }

        # Exam start burst endpoint - queued to avoid thundering herd on DB/Redis.
        location ~ ^/api/exams/[0-9]+/start$ {
            limit_req zone=start_limit burst=2000 nodelay;
            limit_req_status 429;

            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $client_real_ip;
            proxy_set_header X-Forwarded-Proto $client_scheme;
            # Exam start is idempotent because the backend resumes an active
            # session instead of creating duplicates. Retry transient 503/504
            # from a saturated replica on another upstream.
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504 non_idempotent;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 15s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 90s;
            proxy_read_timeout 90s;
        }

        # Session polling endpoint is the hottest read path in exam runtime.
        # Keep a dedicated, high-throughput queue so polling spikes do not
        # starve other /api endpoints in the shared limiter.
        location ~ ^/api/exams/session/[0-9]+/(status|remaining-time)$ {
            limit_req zone=poll_limit burst=4000;
            limit_req_status 429;

            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $client_real_ip;
            proxy_set_header X-Forwarded-Proto $client_scheme;
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 12s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Bulk user provisioning can legitimately take >120s for large imports.
        # Give it a longer timeout so admin batch-create does not fail with 504.
        location = /api/users/batch-create {
            limit_req zone=admin_api_limit burst=1200;
            limit_req_status 429;

            proxy_pass http://fastapi_control_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $client_real_ip;
            proxy_set_header X-Forwarded-Proto $client_scheme;
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 60s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Heavy monitor endpoints (sessions/recovery/violations/live-stats) are
        # intentionally throttled to protect exam runtime throughput.
        location ~ ^/api/monitoring/exam/[0-9]+/(sessions|recovery-candidates|violations|live-stats)$ {
            limit_req zone=monitor_heavy_limit burst=24;
            limit_req_status 429;

            proxy_pass http://fastapi_control_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $client_real_ip;
            proxy_set_header X-Forwarded-Proto $client_scheme;
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 20s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 90s;
            proxy_read_timeout 90s;
        }

        # Isolate admin/teacher control plane from student exam hot-path traffic.
        # This keeps monitoring and control dashboards responsive during exam spikes.
        location ~ ^/api/(monitoring|users|stats|activity|alerts|v1/settings|exam-admin|grading|subjects|questions|media|system-settings|system_settings|templates|backup|telegram-admin|account-security|security-analytics) {
            limit_req zone=admin_api_limit burst=900;
            limit_req_status 429;

            proxy_pass http://fastapi_control_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $client_real_ip;
            proxy_set_header X-Forwarded-Proto $client_scheme;
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 30s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # Upload endpoints - optimized for concurrent file uploads (600 users)
        location ~ ^/api/(upload|media/upload) {
            limit_req zone=api_limit burst=600 nodelay;

            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $client_real_ip;
            proxy_set_header X-Forwarded-Proto $client_scheme;

            # Extended timeouts for file uploads
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # Upload buffering
            proxy_request_buffering off;
            proxy_http_version 1.1;
        }

        # API endpoints - high throughput for 500+ concurrent users
        location /api/ {
            limit_req zone=api_limit burst=1800;
            limit_req_status 429;

            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $client_real_ip;
            proxy_set_header X-Forwarded-Proto $client_scheme;

            # Timeouts
            proxy_connect_timeout 90s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # Answer submit is idempotent (UPSERT by session+question), so we can
        # fail over quickly to another upstream and keep latency bounded.
        location = /api/exams/submit-answer {
            limit_req zone=submit_limit burst=4000;
            limit_req_status 429;

            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $client_real_ip;
            proxy_set_header X-Forwarded-Proto $client_scheme;
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504 non_idempotent;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 12s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 90s;
            proxy_read_timeout 90s;
        }

        # Final exam submit is non-idempotent from business perspective.
        # Keep retries conservative and slightly longer timeout.
        location = /api/exams/submit {
            limit_req zone=submit_limit burst=4000;
            limit_req_status 429;

            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $client_real_ip;
            proxy_set_header X-Forwarded-Proto $client_scheme;
            # Avoid retry amplification on POST submit waves. Student clients
            # already have their own retry loop; Nginx retries here can fan out
            # duplicate pressure and trigger "no live upstreams".
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 20s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 90s;
            proxy_read_timeout 90s;
        }

        # PDF export - longer timeout
        location ~ ^/api/exams/[0-9]+/results/pdf {
            limit_req zone=api_limit burst=5 nodelay;

            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_read_timeout 120s;  # PDF generation may take time
        }

        # WebSocket endpoints
        location /ws/ {
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $client_real_ip;
            proxy_set_header X-Forwarded-Proto $client_scheme;

            # WebSocket timeouts
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # Metrics are scraped directly over the private Docker network.
        # Never expose process/runtime details through the public proxy.
        location ^~ /metrics {
            access_log off;
            return 404;
        }

        # Health check (no rate limit)
        location /health {
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header CF-Connecting-IP "";
            access_log off;
        }

        # Default to API
        location / {
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $client_real_ip;
            proxy_set_header X-Forwarded-Proto $client_scheme;
        }

        # Error pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }

    # Internal stub_status for nginx-exporter. Not on the public listen 80 vhost.
    server {
        listen 8081;
        server_name _;
        access_log off;

        location = /nginx_status {
            stub_status;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            deny all;
        }

        location / {
            return 404;
        }
    }
}
