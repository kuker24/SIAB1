split_clients "$http_authorization" $go_autosave_cohort {
    50% go;
    * fastapi;
}

map $request_uri $go_autosave_canary {
    default fastapi;
    ~^/api/exams/auto-save(\?|$) $go_autosave_cohort;
}

map $go_autosave_canary $autosave_backend {
    default fastapi_backend;
    go go_start_backend;
}
