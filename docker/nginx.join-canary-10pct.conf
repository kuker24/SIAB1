# Stable ten-percent JOIN cohort based on the bearer token.
split_clients "$http_authorization" $go_join_cohort {
    10% go;
    * fastapi;
}

map $request_uri $go_join_canary {
    default fastapi;
    ~^/api/exams/join(\?|$) $go_join_cohort;
}

map $go_join_canary $join_backend {
    default fastapi_backend;
    go go_start_backend;
}
