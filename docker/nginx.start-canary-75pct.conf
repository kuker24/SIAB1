# Stable seventy-five-percent START cohort based on the bearer token.
split_clients "$http_authorization" $go_start_cohort {
    75% go;
    * fastapi;
}

map $request_uri $go_start_canary {
    default fastapi;
    ~^/api/exams/[0-9]+/start$ $go_start_cohort;
}

map $go_start_canary $start_backend {
    default fastapi_backend;
    go go_start_backend;
}
